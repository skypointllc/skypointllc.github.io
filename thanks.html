<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You | SkyPoint Images</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>

  <body class="bg-light d-flex align-items-center" style="min-height: 100vh">
    <div class="container text-center">
      <div class="card border-0 shadow-sm rounded-4 p-5">
        <h1 class="fw-bold mb-3">Thank You!</h1>

        <p class="lead text-secondary mb-4">Your request has been received.</p>

        <p class="text-secondary mb-4">
          I’ll review your message and respond as soon as possible — typically
          within 24 hours.
        </p>

        <div class="mb-4">
          <div class="fw-semibold">Need something urgent?</div>
          <div class="text-secondary small">Call or text: (561) 707-3082</div>
        </div>

        <a href="index.html" class="btn btn-dark btn-lg"> Back to Home </a>
      </div>

      <div class="text-secondary small mt-4">
        © <span id="year"></span> SkyPoint Images
      </div>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
