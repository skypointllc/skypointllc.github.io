    <style>
      .navbar {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        background: transparent !important;
        transition:
          background 0.35s ease,
          box-shadow 0.35s ease;
      }
      .navbar.scrolled {
        background: #111111 !important;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      }
      .navbar .nav-link,
      .navbar .navbar-brand {
        color: #fff !important;
      }
      .navbar .btn-dark {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.5);
      }
      .navbar.scrolled .btn-dark {
        background: #fff;
        color: #111;
        border-color: #fff;
      }
      .navbar-toggler {
        border-color: rgba(255, 255, 255, 0.4);
      }
      .navbar-toggler-icon {
        filter: invert(1);
      }

      body {
        background: #111;
        color: #fff;
      }

      .portfolio-hero {
        padding: 140px 0 60px;
        text-align: center;
        background: #111;
      }
      .portfolio-hero h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 700;
      }
      .portfolio-hero p {
        color: rgba(255, 255, 255, 0.55);
        font-size: 1.05rem;
      }

      .portfolio-grid {
        columns: 3 280px;
        column-gap: 12px;
        padding: 0 1rem 4rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      .portfolio-grid .grid-item {
        display: block;
        width: 100%;
        break-inside: avoid;
        margin: 0 0 12px;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        cursor: pointer;
        content-visibility: auto;
        contain-intrinsic-size: 320px 240px;
      }
      .portfolio-grid .grid-item img {
        width: 100%;
        display: block;
        transition:
          opacity 0.25s ease,
          transform 0.4s ease;
      }
      .portfolio-grid .grid-item:hover img,
      .portfolio-grid .grid-item:focus-visible img {
        transform: scale(1.03);
      }
      .portfolio-grid .grid-item:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.93);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .lightbox.active {
        display: flex;
      }
      .lightbox img {
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 8px;
      }
      .lightbox-close,
      .lightbox-prev,
      .lightbox-next {
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
        line-height: 1;
        opacity: 0.72;
      }
      .lightbox-close:hover,
      .lightbox-prev:hover,
      .lightbox-next:hover {
        opacity: 1;
      }
      .lightbox-close {
        position: absolute;
        top: 1.25rem;
        right: 1.5rem;
        font-size: 2rem;
      }
      .lightbox-prev,
      .lightbox-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2.5rem;
        padding: 0 1rem;
        user-select: none;
      }
      .lightbox-prev {
        left: 0.5rem;
      }
      .lightbox-next {
        right: 0.5rem;
      }

      footer {
        background: #111;
        border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
      }
      footer .text-secondary {
        color: rgba(255, 255, 255, 0.4) !important;
      }
      footer a.text-secondary {
        color: rgba(255, 255, 255, 0.4) !important;
        transition: color 0.2s ease;
      }
      footer a.text-secondary:hover {
        color: #fff !important;
      }
    </style>

      const grid = document.getElementById('portfolioGrid');

      portfolioImages.forEach((image, index) => {
        const item = document.createElement('button');
        item.className = 'grid-item';
        item.type = 'button';
        item.setAttribute('aria-label', 'Open portfolio image ' + (index + 1));

        const img = document.createElement('img');
        img.src = image.thumb;
        img.dataset.full = image.full;
        img.alt = image.alt;
        img.decoding = 'async';
        img.loading = index < 8 ? 'eager' : 'lazy';
        img.fetchPriority = index < 4 ? 'high' : 'low';

        item.appendChild(img);
        grid.appendChild(item);
      });

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const items = Array.from(document.querySelectorAll('.grid-item img'));
      let currentIndex = 0;

      function showLightboxImage(index) {
        currentIndex = (index + items.length) % items.length;
        lightboxImg.src = items[currentIndex].dataset.full;
        lightboxImg.alt = items[currentIndex].alt;
      }

      function openLightbox(index) {
        showLightboxImage(index);
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        document.getElementById('lightboxClose').focus();
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }

      items.forEach((img, index) => {
        img.parentElement.addEventListener('click', () => openLightbox(index));
      });

      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      document.getElementById('lightboxPrev').addEventListener('click', () => showLightboxImage(currentIndex - 1));
      document.getElementById('lightboxNext').addEventListener('click', () => showLightboxImage(currentIndex + 1));

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (event) => {
        if (!lightbox.classList.contains('active')) return;
        if (event.key === 'Escape') closeLightbox();
        if (event.key === 'ArrowLeft') showLightboxImage(currentIndex - 1);
        if (event.key === 'ArrowRight') showLightboxImage(currentIndex + 1);
      });
    </script>
